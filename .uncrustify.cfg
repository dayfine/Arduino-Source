# Uncrustify 0.83.0. Usage and scope: devtools/format/README.md.
# Keep include order, comment text, existing LF/CRLF and unlimited line width.
newlines = auto
input_tab_size = 4
output_tab_size = 4
indent_columns = 4
indent_continue = 4
indent_with_tabs = 0
indent_namespace = false
indent_access_spec = 1
code_width = 0
cmt_width = 0
cmt_reflow_mode = 0
cmt_indent_multi = false
mod_sort_include = false
mod_sort_using = false
mod_remove_duplicate_include = false

# Compact braces, with a space before control parentheses: if (ready()){
sp_before_sparen = force
sp_sparen_brace = remove
# Preserve alignment before short-function bodies (const/non-const overloads).
sp_fparen_brace = ignore
sp_cpp_lambda_paren_brace = remove
sp_cpp_lambda_square_brace = remove
sp_word_brace_ns = remove
sp_enum_brace = remove
sp_paren_brace = remove
sp_else_brace = remove
sp_brace_else = remove
sp_try_brace = remove
sp_catch_brace = remove
sp_brace_catch = remove
sp_do_brace_open = remove
sp_brace_close_while = remove
nl_if_brace = remove
nl_for_brace = remove
nl_while_brace = remove
nl_switch_brace = remove
nl_do_brace = remove
nl_try_brace = remove
nl_catch_brace = remove
nl_else_brace = remove
nl_brace_else = remove
nl_namespace_brace = remove
nl_class_brace = remove
nl_struct_brace = remove
nl_enum_brace = remove
# Preserve constructor brace/comment placement; attaching across a commented-out
# initializer moves the brace past the comment. Same-line gaps still collapse.
nl_fdef_brace = ignore

# Type-attached pointers/references; conventional operator/comma spacing.
sp_before_ptr_star = remove
sp_after_ptr_star = force
sp_before_byref = remove
sp_after_byref = force
sp_assign = force
sp_arith = force
sp_compare = force
sp_bool = force
sp_after_comma = force
sp_before_comma = remove

# Expand braced control bodies, but do not add/remove any braces or statements.
nl_split_if_one_liner = true
nl_split_for_one_liner = true
nl_split_while_one_liner = true
mod_full_brace_if = ignore
mod_full_brace_for = ignore
mod_full_brace_while = ignore
mod_full_brace_do = ignore
mod_full_brace_function = ignore
mod_paren_on_return = ignore
mod_paren_on_throw = ignore
mod_remove_extra_semicolon = false
mod_remove_empty_return = false
mod_enum_last_comma = ignore
mod_add_long_namespace_closebrace_comment = 0
# Keep type spacing: `remove` can merge `operator const Type` into constType.
# This preserves existing standalone class-name/brace spacing as well.
sp_after_type = ignore
sp_angle_shift = ignore
sp_permit_cpp11_shift = true
indent_class = true

sp_before_class_colon = force
sp_after_class_colon = force

# Preserve compact functions/tables and extra spacing between tokens.
# Leading declaration alignment still needs explicit protection; see README.
nl_func_leave_one_liners = true
nl_getset_leave_one_liners = true
nl_class_leave_one_liners = true
nl_cpp_lambda_leave_one_liners = true
nl_assign_leave_one_liners = true
nl_enum_leave_one_liners = true
align_keep_extra_space = true

# Keep closing-parenthesis columns and the repository's continuation layout.
# Keeping the first continuation verbatim makes some nested-lambda/table cases
# drift on every pass in 0.83.0. Use a stable four-space continuation instead.
indent_ignore_first_continue = false
indent_paren_close = -1

# The repository consistently spells parameter packs class... / typename....
sp_type_ellipsis = remove
sp_before_ellipsis = remove
# Keep a braced argument indented relative to the enclosing call's parentheses.
indent_paren_open_brace = true
indent_func_call_param = true

# Match existing lambda bodies inside calls; do not apply continuation twice.
indent_cpp_lambda_only_once = true
nl_brace_catch = remove
