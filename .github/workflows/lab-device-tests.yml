name: Lab device ownership
on:
  pull_request:
  workflow_dispatch:
jobs:
  native-leases:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true
      - run: cmake -S SerialPrograms/Source/CommonFramework/Devices -B build-lab-devices -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-lab-devices --config Debug -j4
      - run: ctest --test-dir build-lab-devices -C Debug --output-on-failure
