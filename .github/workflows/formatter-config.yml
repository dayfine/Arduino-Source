name: Formatter configuration
on:
  pull_request:
    paths:
      - '.clang-format'
      - 'devtools/format/**'
      - '.github/workflows/formatter-config.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.8
      - run: python -m unittest discover -s devtools/format -v
