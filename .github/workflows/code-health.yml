name: C++ Code Health
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: devtools/code_health/requirements.txt
      - run: python -m pip install -r devtools/code_health/requirements.txt
      - name: Linter self-tests
        run: python -m unittest discover -s devtools/code_health/tests -v
      - name: Check changed C++ files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git hash-object -w -t tree --stdin </dev/null)
          fi
          python -m devtools.code_health --base-ref "$base" --github
