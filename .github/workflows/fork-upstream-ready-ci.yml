name: Fork Upstream-Ready CI
# Fork only. The full platform set, for a draft about to be handed upstream.
# Runs when the PR gets the "ready-for-upstream" label, on each later push while
# it has the label, or by hand: gh workflow run fork-upstream-ready-ci.yml --ref <branch>
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'dayfine/Arduino-Source' &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(github.event.pull_request.labels.*.name, 'ready-for-upstream') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ready-for-upstream')))
    steps:
      - run: echo "Running the full platform set."
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, compiler: default, run-tests: true}
          - {os: macos-15-intel, compiler: default, run-tests: true}
          - {os: ubuntu-26.04, compiler: clang, run-tests: true}
          - {os: ubuntu-26.04, compiler: default, run-tests: true}
          - {os: windows-2025, compiler: clang, run-tests: true}
          - {os: windows-2025, compiler: default, run-tests: true}
    uses: ./.github/workflows/cpp-ci-serial-programs-base.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      run-tests: ${{ matrix.run-tests }}
