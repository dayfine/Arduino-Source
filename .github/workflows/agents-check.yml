# harness: project
# Checks for what lives on the agents notes branch: scripts, lab control, Python tools, and the
# C++ Code Health linter's self-tests. The linter (devtools/code_health) lives here; code branches'
# code-health.yml checks out this branch to run it on their C++, and so does our pre-push hook.
name: Agents Check

on:
  pull_request:
    branches: [agents]
  push:
    branches: [agents]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (sh -n)
        run: |
          status=0
          for f in $(git ls-files '*.sh') tools/hooks/pre-push; do
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; status=1; }
          done
          exit $status
      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') tools/hooks/pre-push
      - name: Lab lock race test
        run: sh lab/control/lablock_test.sh 20
      - name: Lab disk GC deployment rule test
        run: sh lab/scripts/disk_gc_test.sh
      - name: Python syntax
        run: python3 -m py_compile $(git ls-files 'tools/*.py' 'bin/*.py' 'lab/*.py' 'devtools/*.py')
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: devtools/code_health/requirements.txt
      - name: Offline development launcher tests
        run: python3 -m unittest discover -s lab/scripts -p test_start_dev.py -v
      - name: Lab Claude script tests
        run: python3 -m unittest discover -s lab/scripts -p test_lab_claude.py -v
      - name: Code health linter self-tests
        run: |
          python -m pip install -r devtools/code_health/requirements.txt
          python -m unittest discover -s devtools/code_health/tests -v
      - name: Harness checks
        run: |
          sh bin/agent-harness-check.sh
          sh bin/agent-standing-rules-check.sh
